  } else if (modo === 'login') {
    b.innerHTML = `<h2>Entrar</h2>
      <p>Entre com a sua conta Google. No primeiro acesso, o administrador precisa liberar a sua entrada.</p>
      <div class="gate-msg" id="gMsg">${esc(aviso)}</div>
      <div id="gGoogle"><small style="color:var(--muted)">Carregando...</small></div>`;
    prepararGoogle();
  } else if (modo === 'conectando') {
    b.innerHTML = `<h2>Conectando...</h2><p>Ligando este aparelho à nuvem da BLS Refrigeração. Aguarde alguns segundos.</p>`;
  } else if (modo === 'pendente') {
    b.innerHTML = `<h2>Aguardando liberação</h2>
      <p>${aviso}</p>
      <p>Avise o administrador. Depois que ele liberar, toque em <b>Tentar de novo</b>.</p>
      <button class="btn" id="gDeNovo">Tentar de novo</button>`;
    $('#gDeNovo').onclick = () => mostrarGate('login');
  }
}
function carregarScript(src) {
  return new Promise((res, rej) => {
    if (document.querySelector(`script[src="${src}"]`)) return window.google && google.accounts ? res() : setTimeout(res, 800);
    const sc = document.createElement('script'); sc.src = src; sc.async = true; sc.onload = res; sc.onerror = rej; document.head.appendChild(sc);
  });
}
async function prepararGoogle() {
  const el = $('#gGoogle'); if (!el) return;
  let cid = lsGet('googleClientId') || '';
  try { cid = (await Sync.api('ping')).googleClientId || ''; lsSet('googleClientId', cid); } catch (e) {}
  if (!$('#gGoogle')) return;
  if (!cid) { el.innerHTML = '<small style="color:var(--muted)">O login com Google será liberado em instantes.</small>'; return; }
  try {
    await carregarScript('https://accounts.google.com/gsi/client');
    google.accounts.id.initialize({ client_id:cid, callback: async r => {
      gateMsg('Verificando...');
      try {
        const x = await Sync.api('loginGoogle', { credencial:r.credential });
        if (x.pendente) mostrarGate('pendente', `Olá, <b>${esc(x.nome)}</b>! Seu acesso (${esc(x.email)}) foi solicitado e está aguardando a liberação do administrador.`);
        else entrouCom(x.sessao);
      }
      catch (e) { gateMsg(e.message); }
    } });
    el.innerHTML = '';
    google.accounts.id.renderButton(el, { theme:'filled_blue', size:'large', text:'signin_with', locale:'pt-BR', shape:'pill', width:300 });
  } catch (e) { el.innerHTML = '<small style="color:var(--muted)">Sem conexão com o Google.</small>'; }
}
async function entrouCom(sessao) {
  Sessao.set(sessao);
  $('#gateBody').innerHTML = '<h2>Entrando...</h2><p>Carregando o seu perfil.</p>';
  await conferirNome();
  $('#gate').classList.add('hidden');
  aplicarPerfil();
  toast('Olá, ' + Sessao.get().nome + '!');
  go('inicio');
  Sync.rodar();
  verificarPendentes();
  prepararAtalhoIOS();
  oferecerInstalar();
}
async function verificarPendentes() {
  const b = $('#bCfg'); if (!Sessao.admin()) { b.classList.add('hidden'); return; }
  try {
    const n = (await Sync.api('usuarios')).usuarios.filter(u => u.situacao === 'Pendente').length;
    b.textContent = n; b.title = n + ' aguardando liberação'; b.classList.toggle('hidden', !n);
  } catch (e) {}
}
/* ---------- Perfil, nome e permissões ---------- */
const NOMES_ABAS = { atendimentos:'Atendimentos', cobranca:'Cobrança', teste:'Teste de Frio', manuais:'Manuais' };
const Perfil = {
  get() { try { return JSON.parse(lsGet('perfil') || 'null'); } catch (e) { return null; } },
  async carregar() {
    if (!Sessao.get() || !Sync.cfg()) return null;
    try {
      const r = await Sync.api('perfil');
      lsSet('perfil', JSON.stringify({ ...r, email:Sessao.get().usuario }));
      const s = Sessao.get();
      if (s && r.nomeApp && s.nome !== r.nomeApp) Sessao.set({ ...s, nome:r.nomeApp });
      aplicarPerfil();
      if (!podeVerView(atual.view)) go('inicio');
      return r;
    } catch (e) { return null; }
  },
};
function abasLiberadas() {
  const s = Sessao.get(); if (!s) return [];
  if (s.admin) return ['atendimentos', 'cobranca', 'teste', 'manuais'];
  const p = Perfil.get();
  if (p && p.email === s.usuario && Array.isArray(p.abas)) return p.abas;
  return ['atendimentos', 'teste', 'manuais'];
}
const podeVer = aba => abasLiberadas().includes(aba);
function podeVerView(v) {
  const aba = { atendimentos:'atendimentos', cobranca:'cobranca', teste:'teste', testeForm:'teste', testeDet:'teste', manuais:'manuais' }[v];
  return !aba || podeVer(aba);
}
async function salvarNome(nome) {
  const r = await Sync.api('salvarPerfil', { nomeApp:nome });
  const s = Sessao.get(); Sessao.set({ ...s, nome:r.nomeApp });
  const p = Perfil.get() || {}; p.nomeApp = r.nomeApp; p.email = s.usuario; lsSet('perfil', JSON.stringify(p));
  aplicarPerfil();
  return r.nomeApp;
}
function pedirNome(sugestao) {
  return new Promise(res => {
    $('#gate').classList.remove('hidden');
    $('#gateBody').innerHTML = `<h2>Como você se chama?</h2>
      <p>Esse é o nome que vai aparecer nos atendimentos e testes que você registrar. Dá para mudar depois em <b>Perfil</b>.</p>
      <label>Seu nome</label><input class="inp" id="gNome" autocomplete="name" value="${esc(sugestao || '')}" placeholder="Ex.: João Silva">
      <div class="gate-msg" id="gMsg"></div>
      <button class="btn" id="gSalvarNome">Continuar</button>`;
    const i = $('#gNome'); i.focus(); i.select();
    const ok = async e => {
      const nome = i.value.trim();
      if (nome.length < 2) { gateMsg('Informe o seu nome.'); return; }
      gateCarregando($('#gSalvarNome'), true);
      try { await salvarNome(nome); $('#gate').classList.add('hidden'); res(nome); }
      catch (err) { gateMsg(err.message); gateCarregando($('#gSalvarNome'), false); }
    };
    $('#gSalvarNome').onclick = ok;
    i.onkeydown = e => { if (e.key === 'Enter') ok(); };
  });
}
async function conferirNome() {
  const p = await Perfil.carregar();
  if (p && !p.nomeApp) await pedirNome(p.nomeGoogle || Sessao.get().nome);
}
async function vPerfil() {
  cab('Perfil', 'Seus dados no app');
  const s = Sessao.get() || {}, p = Perfil.get() || {};
  $('#view').innerHTML = `
    <div class="card cfg" style="max-width:660px">
      <h3 style="margin-top:0">Meu nome no app</h3>
      <p style="color:var(--muted);margin-top:0">É o nome que aparece nos atendimentos e testes que você registra.</p>
      <label>Nome</label><input class="inp" id="pNome" value="${esc(s.nome || '')}" autocomplete="name">
      <div class="btnrow"><button class="btn" data-perfil="salvar">Salvar nome</button></div>
    </div>
    <div class="card" style="max-width:660px;margin-top:14px">
      <div class="kv" style="margin-top:0">
        <div><span class="lbl">Conta Google</span><b style="word-break:break-all">${esc(s.usuario || '')}</b></div>
        <div><span class="lbl">Categoria</span><b>${esc(p.categoria || 'Técnico')}</b></div>
        <div><span class="lbl">Abas liberadas</span><b>${['Início', ...abasLiberadas().map(a => NOMES_ABAS[a])].join(', ')}</b></div>
        <div><span class="lbl">Versão do app</span><b>${APP_VERSAO}</b></div>
      </div>
      <div class="btnrow" style="margin-top:16px"><button class="btn ghost" data-perfil="sair">Sair da conta</button></div>
    </div>`;
}
async function perfilAcao(acao) {
  if (acao === 'salvar') {
    const nome = $('#pNome').value.trim();
    if (nome.length < 2) { toast('Informe o seu nome.'); return; }
    try { await salvarNome(nome); toast('Nome salvo ✓'); } catch (e) { toast(e.message); }
  } else if (acao === 'sair') {
    if (!await confirmar('Sair da conta?', 'Para entrar de novo, use o botão do Google.', 'Sair', 'danger')) return;
    await flush(); Sessao.sair(); aplicarPerfil(); mostrarGate('login');
  }
}
function aplicarPerfil() {
  const s = Sessao.get();
  document.querySelector('[data-nav="config"]').classList.toggle('hidden', !s);
  $('#lblCfg').textContent = s && s.admin ? 'Ajustes' : 'Perfil';
  ['atendimentos', 'cobranca', 'teste', 'manuais'].forEach(a => document.querySelector(`[data-nav="${a}"]`).classList.toggle('hidden', !!s && !podeVer(a)));
  $('#nav').classList.toggle('seis', document.querySelectorAll('#nav [data-nav]:not(.hidden)').length > 5);
  const ub = $('#userBtn');
  ub.classList.toggle('hidden', !s);
  if (s) { ub.textContent = s.nome.split(/\s+/).slice(0, 2).map(x => x[0] || '').join('').toUpperCase(); ub.title = s.nome; }
}
$('#userBtn').onclick = async () => {
  const s = Sessao.get(); if (!s) return;
  const r = await modal({ titulo: esc(s.nome), corpo: `${s.admin ? 'Administrador · ' : ''}${esc(s.usuario)}`,
    botoes: [{ label:'Fechar', cls:'ghost', valor:false }, { label:'Sair', cls:'danger', valor:true }] });
  if (!r) return;
  await flush(); Sessao.sair(); aplicarPerfil(); mostrarGate('login');
};

/* =========================================================
   Cliques (delegação)
   ========================================================= */
$('#view').addEventListener('click', async e => {
  const t = e.target;
  let el;
  if ((el = t.closest('[data-delm]'))) { e.stopPropagation(); return removerMidia(el.dataset.delm, el.dataset.campo); }
  if ((el = t.closest('[data-deldraft]'))) { e.stopPropagation(); obsDraft.fotos.splice(+el.dataset.deldraft, 1); freeUrls(); return render(); }
  if ((el = t.closest('[data-delobs]'))) { return excluirObs(el.dataset.delobs); }
  if ((el = t.closest('[data-obs]'))) { return obsAcao(el.dataset.obs); }
  if ((el = t.closest('[data-inst]'))) {
    if (el.dataset.inst === 'fechar') { lsSet('instalarFechado', '1'); atualizarInstalar(); toast('Você pode instalar depois pelo menu do navegador.'); return; }
    return instalarAgora();
  }
  if ((el = t.closest('[data-mtab]'))) { manTab = el.dataset.mtab; return render(); }
  if ((el = t.closest('[data-man]'))) { const a = el.dataset.man; if (a === 'perguntar') return perguntarIA(); if (a === 'novo') return novoManual(); if (a === 'pecas') return importarPecas(); if (a === 'buscaPeca') return buscarPeca(); return; }
  if ((el = t.closest('[data-pag]'))) { const [m, p] = el.dataset.pag.split('|'); return verPagina(m, +p); }
  if ((el = t.closest('[data-pagdl]'))) { const [m, p] = el.dataset.pagdl.split('|'); return baixarPagina(m, +p); }
  if ((el = t.closest('[data-mdel]'))) { return excluirManual(el.dataset.mdel); }
  if ((el = t.closest('[data-ia]'))) { return iaAcao(el.dataset.ia); }
  if ((el = t.closest('[data-perfil]'))) { return perfilAcao(el.dataset.perfil); }
  if ((el = t.closest('[data-perm]'))) { return salvarPermissoes(); }
  if ((el = t.closest('[data-cfg]'))) { return cfgAcao(el.dataset.cfg); }
  if ((el = t.closest('[data-usu]'))) { return usuarioAcao(el.dataset.usu, el.dataset.op); }
  if ((el = t.closest('[data-set]'))) { return marcarBR(el); }
  if ((el = t.closest('[data-pm]'))) { return trocarSinal(el.dataset.pm); }
  if ((el = t.closest('[data-cob]')))  { return mudarCobranca(el.closest('[data-id]').dataset.id, el.dataset.cob); }
  if ((el = t.closest('[data-ver]')))  { return verMidia(el.dataset.ver); }
  if ((el = t.closest('[data-cam]')))  { return abrirCamera(el.dataset.cam); }
  if ((el = t.closest('[data-filtro]'))) { filtros.status = el.dataset.filtro; return render(); }
  if ((el = t.closest('[data-nav2]'))) { return go(el.dataset.nav2); }
  if ((el = t.closest('[data-act]'))) {
    const act = el.dataset.act;
    if (act === 'novo') return novoAtendimento();
    if (act === 'finalizar') return finalizar();
    if (act === 'excluir') return excluir();
    if (act === 'novoTeste') return novoTeste();
    if (act === 'concluirTeste') return concluirTeste();
    if (act === 'excluirTeste') return excluirTeste();
    if (act === 'reabrirTeste') return reabrirTeste();
    if (act === 'imprimirTeste') return imprimirTeste();
    if (act === 'excluirAdm') return excluirAdm();
  }
  if ((el = t.closest('[data-open]'))) {
    const a = await getAtend(el.dataset.open);
    if (a.tipo === 'teste') return go(a.status === 'concluido' ? 'testeDet' : 'testeForm', a.id);
    return go(a.status === 'pendente' ? 'form' : 'detalhe', a.id);
  }
});
/* Atualização automática: quando houver versão nova no site, o app recarrega sozinho */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').then(reg => {
    setInterval(() => reg.update().catch(() => {}), 30 * 60 * 1000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => {}); });
  }).catch(() => {});
  let recarregou = false;
  navigator.serviceWorker.addEventListener('controllerchange', async () => {
    if (recarregou) return; recarregou = true;
    if (Cam.stream || AudioRec.rec) return;      // não interrompe gravação; aplica na próxima abertura
    await flush(); location.reload();
  });
}
window.addEventListener('pagehide', () => { if (saveT) salvar(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && saveT) salvar(); });

/* =========================================================
   Início
   ========================================================= */
(async () => {
  try {
    $('#versao').textContent = APP_VERSAO;
    $('#topLogo').src = $('#logoImg').src;
    await DB.open();
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
    aplicarPerfil();
    if (!Sync.cfg() || !Sessao.get()) mostrarGate();
    await configPorLink();
    prepararAtalhoIOS();
    await render();
    Sync.rodar();
    if (Sessao.get() && Sync.cfg()) conferirNome();
    if (Sessao.admin()) verificarPendentes();
    setInterval(() => { if (!document.hidden) Sync.rodar(); }, 60 * 1000);
    setInterval(() => { if (!document.hidden) { verificarPendentes(); Perfil.carregar(); } }, 5 * 60 * 1000);
    window.addEventListener('online', () => Sync.rodar());
    window.addEventListener('offline', () => Sync.rodar());
    document.addEventListener('visibilitychange', () => { if (!document.hidden) Sync.rodar(); });
  } catch (e) {
    $('#view').innerHTML = `<div class="empty">Não foi possível abrir o armazenamento local deste navegador.<br>${esc(e.message || e)}</div>`;
  }
})();
</script>
