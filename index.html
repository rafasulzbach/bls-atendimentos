<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#142269">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>BLS Refrigeração · Atendimentos</title>
<style>
:root{
  --bg:#f2f5f9; --card:#fff; --ink:#14213d; --muted:#66758c; --line:#e1e7ef;
  --pri:#1f45b5; --pri-d:#17378f; --pri-l:#e7eefb; --acc:#46aadc; --side:#142269; --side-2:#1e3088;
  --red:#d6362f; --red-l:#fdecea;
  --pend:#c26a00; --pend-l:#fff3e0;
  --esp:#5b5fc7; --esp-l:#eeeefc;
  --env:#0a7bd3; --env-l:#e5f2fd;
  --ok:#1f8a4c; --ok-l:#e6f5ec;
  --r:14px; --sh:0 1px 2px rgba(16,33,61,.06),0 4px 14px rgba(16,33,61,.06);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Segoe UI",Roboto,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea{font:inherit;color:inherit}
.hidden{display:none!important}

/* ---------- Layout ---------- */
.app{display:flex;min-height:100vh}
.sidebar{align-self:flex-start;width:240px;background:var(--side);color:#cfd8e8;display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh;flex-shrink:0}
.brand{padding:2px 6px 20px;text-align:center}
.brand img{width:100%;max-width:200px;display:block;margin:0 auto}
.brand small{display:block;font-size:11.5px;color:#9fb2e0;letter-spacing:.5px;margin-top:6px}
.toplogo{display:none;height:34px;border-radius:6px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;text-align:left;color:#d5ddf3;font-weight:500}
.nav button:hover{background:var(--side-2)}
.nav button.on{background:var(--acc);color:#0d1850;font-weight:600}
.nav .ico{width:20px;text-align:center;font-size:17px}
.nav .badge{margin-left:auto;background:rgba(255,255,255,.14);border-radius:20px;font-size:12px;padding:1px 8px;min-width:22px;text-align:center}
.nav button.on .badge{background:rgba(13,24,80,.18)}
.side-foot{margin-top:auto;font-size:12px;color:#8fa1d0;padding:8px}
main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{padding:22px 32px 6px;display:flex;align-items:center;gap:12px}
.topbar h1{margin:0;font-size:24px;font-weight:700}
.topbar .sub{color:var(--muted);font-size:14px}
#view{padding:14px 32px 120px;max-width:1150px;width:100%}

/* ---------- Componentes ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:10px;font-weight:600;background:var(--pri);color:#fff;transition:.15s}
.btn:hover{background:var(--pri-d)}
.btn.sec{background:var(--pri-l);color:var(--pri)}
.btn.sec:hover{background:#d8e6fb}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn.danger{background:var(--red-l);color:var(--red)}
.btn.big{padding:16px 26px;font-size:17px;border-radius:12px}
.btn:disabled{opacity:.5;cursor:default}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-pend{background:var(--pend-l);color:var(--pend)}
.s-esp{background:var(--esp-l);color:var(--esp)}
.s-env{background:var(--env-l);color:var(--env)}
.s-ok{background:var(--ok-l);color:var(--ok)}
.sec-title{display:flex;align-items:center;gap:10px;margin:28px 0 12px;font-size:17px}
.sec-title .count{background:var(--pend-l);color:var(--pend);font-size:13px;padding:2px 10px;border-radius:20px}
.empty{color:var(--muted);text-align:center;padding:34px 10px;background:var(--card);border-radius:var(--r);border:1px dashed var(--line)}

.hero{display:flex;align-items:center;justify-content:space-between;gap:20px;background:linear-gradient(120deg,#142269 0%,#1f45b5 70%,#2f7cc4 100%);border-left:6px solid var(--acc);color:#fff;border-radius:18px;padding:26px 28px;box-shadow:var(--sh)}
.hero h2{margin:0 0 6px;font-size:22px}
.hero p{margin:0;color:#d6e2ff;font-size:14.5px;max-width:520px}
.hero .btn{background:#fff;color:var(--pri)}
.hero .btn:hover{background:#eaf1ff}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.acard{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px;cursor:pointer;border:1px solid transparent;transition:.15s;display:flex;flex-direction:column;gap:10px}
.acard:hover{border-color:#c8d6ec;transform:translateY(-1px)}
.acard .row1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.acard .num{font-weight:700;color:var(--muted);font-size:13px}
.acard .placa{font-size:19px;font-weight:700;letter-spacing:.5px}
.acard .meta{color:var(--muted);font-size:13.5px;display:flex;flex-wrap:wrap;gap:4px 14px}
.prog{height:6px;background:#edf1f6;border-radius:6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--pend);border-radius:6px}
.prog.full i{background:var(--ok)}
.falta{display:flex;flex-wrap:wrap;gap:5px}
.falta span{font-size:11.5px;background:var(--red-l);color:var(--red);padding:2px 8px;border-radius:12px}

/* Filtros */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 14px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-size:13.5px;font-weight:500}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip small{opacity:.65;margin-left:4px}
.search{flex:1;min-width:200px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card)}

/* Lista linhas */
.rows{display:flex;flex-direction:column;gap:10px}
.rowc{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px;display:grid;grid-template-columns:70px 1.1fr 1.2fr 1fr auto;gap:12px;align-items:center;cursor:pointer}
.rowc:hover{outline:1px solid #c8d6ec}
.rowc .n{font-weight:700;color:var(--muted)}
.rowc .p{font-weight:700;font-size:16px;letter-spacing:.4px}
.rowc .t{color:var(--muted);font-size:13.5px}
.lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);display:block;margin-bottom:2px}

/* Cobrança */
.cob{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px;display:flex;flex-wrap:wrap;gap:14px 22px;align-items:center}
.cob .info{flex:1;min-width:220px;display:flex;gap:16px;align-items:center;cursor:pointer}
.cob .info .p{font-size:18px;font-weight:700}
.seg{display:flex;background:#eef2f7;border-radius:12px;padding:4px;gap:4px}
.seg button{display:flex;flex-direction:column;align-items:center;padding:7px 14px;border-radius:9px;min-width:112px;color:var(--muted)}
.seg button b{font-size:13.5px}
.seg button small{font-size:11.5px;margin-top:2px}
.seg button:hover{background:#e2e8f1}
.seg button.on.s-esp{background:var(--esp);color:#fff}
.seg button.on.s-env{background:var(--env);color:#fff}
.seg button.on.s-ok{background:var(--ok);color:#fff}
.resumo{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.resumo .card{display:flex;flex-direction:column;gap:2px}
.resumo .card b{font-size:26px}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);cursor:pointer;user-select:none}
.switch input{width:18px;height:18px;accent-color:var(--pri)}

/* Formulário */
.formtop{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.saveinfo{margin-left:auto;font-size:13px;color:var(--ok)}
.fields{display:flex;flex-direction:column;gap:14px;max-width:760px}
.field{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px 18px;border:2px solid transparent;transition:.2s}
.field.erro{border-color:var(--red);background:#fffafa}
.field.okf .flabel::after{content:"✓";color:var(--ok);margin-left:auto;font-weight:700}
.flabel{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:10px}
.flabel .req{color:var(--red)}
.flabel small{font-weight:400;color:var(--muted)}
.inp{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fbfcfe;font-size:16px}
.inp:focus{outline:2px solid var(--pri);border-color:transparent;background:#fff}
textarea.inp{min-height:110px;resize:vertical}
.placa-inp{text-transform:uppercase;letter-spacing:1px;font-weight:600}
.thumbs{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.thumbs:empty{display:none}
.th{position:relative;width:96px;height:96px;border-radius:10px;overflow:hidden;background:#111;cursor:pointer;flex-shrink:0}
.th img,.th video{width:100%;height:100%;object-fit:cover;display:block}
.th .play{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:28px;text-shadow:0 1px 6px rgba(0,0,0,.6);pointer-events:none}
.th .del{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;font-size:15px;line-height:26px;text-align:center}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.audios{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.audio-item{display:flex;align-items:center;gap:8px;background:#f5f8fc;border-radius:10px;padding:6px 8px}
.audio-item audio{flex:1;height:36px;min-width:0}
.audio-item .del{width:30px;height:30px;border-radius:50%;background:var(--red-l);color:var(--red)}
.recbtn.rec{background:var(--red);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.75}}
.ou{color:var(--muted);font-size:13px;margin:10px 0 8px}
.finalbar{position:sticky;bottom:0;margin-top:18px;padding:14px 0;background:linear-gradient(transparent,var(--bg) 30%);display:flex;gap:10px;max-width:760px}
.finalbar .btn.fin{flex:1;padding:15px;font-size:16px;background:var(--ok)}
.finalbar .btn.fin:hover{background:#18723e}

/* Detalhe */
.det-head{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.det-head h2{margin:0;font-size:24px;letter-spacing:.5px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;margin-top:16px}
.kv div b{display:block;font-size:15px;margin-top:2px}
.det-sec{margin-top:14px}
.det-sec h3{margin:0 0 10px;font-size:15px}
.desc{white-space:pre-wrap;background:#f7f9fc;border-radius:10px;padding:12px;line-height:1.5}
.timeline{display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--muted)}
.timeline div{display:flex;gap:10px;align-items:center}

.os-tag{font-size:12px;font-weight:600;color:var(--pri);background:var(--pri-l);padding:2px 8px;border-radius:8px}
.opc{font-weight:400;font-size:12px;color:var(--muted);background:#eef2f7;padding:1px 8px;border-radius:8px}
.obs-list{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
.obs-item{border-left:3px solid var(--acc);background:#f7f9fc;border-radius:0 10px 10px 0;padding:10px 12px}
.obs-item .oh{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.obs-item .oh button{color:var(--red);font-size:12.5px}
.obs-item .ot{white-space:pre-wrap;line-height:1.5;margin-bottom:6px}
.obs-item .thumbs{margin:6px 0 0}
.obs-new{border-top:1px dashed var(--line);padding-top:14px}
.os-det{display:flex;gap:8px;align-items:center;max-width:320px}
/* Nuvem */
.syncinfo{margin-left:auto;font-size:13px;padding:7px 13px;border-radius:20px;background:var(--card);box-shadow:var(--sh);white-space:nowrap;font-weight:600}
.syncinfo.ok{color:var(--ok)} .syncinfo.erro,.syncinfo.local{color:var(--red)} .syncinfo.envio{color:var(--pri)} .syncinfo.offline{color:var(--pend)}
.th .nuvem{position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;border-radius:8px;padding:1px 6px}
.th.lazy{display:grid;place-items:center;color:#cbd5e1;font-size:22px;background:#2b3550}
.th.lazy img{position:absolute;inset:0}
.cfg label{font-weight:600;display:block;margin-bottom:6px}
.cfg .inp{margin-bottom:14px}
/* Login */
.gate{position:fixed;inset:0;z-index:65;background:linear-gradient(160deg,#142269 0%,#1b3596 60%,#2f7cc4 100%);overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 18px}
.gate>img{width:220px;max-width:70%;margin-bottom:22px}
.gate-box{background:#fff;border-radius:18px;max-width:380px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.gate-box h2{margin:0 0 4px;font-size:20px}
.gate-box p{margin:0 0 16px;color:var(--muted);font-size:14px;line-height:1.45}
.gate-box label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
.gate-box .inp{margin-bottom:14px}
.gate-box .btn{width:100%;padding:13px}
.gate-msg{color:var(--red);font-size:14px;min-height:20px;margin:-4px 0 10px}
.gate-sep{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12.5px;margin:20px 0 14px}
.gate-sep::before,.gate-sep::after{content:"";flex:1;height:1px;background:var(--line)}
#gGoogle{display:flex;justify-content:center;min-height:44px}
.gate-ver{color:#b9c6ec;font-size:12px;margin-top:16px}
.userbtn{width:36px;height:36px;border-radius:50%;background:var(--side);color:#fff;font-weight:700;font-size:13px;flex-shrink:0}
.ulist{display:flex;flex-direction:column;gap:8px}
.urow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 12px;background:#f7f9fc;border-radius:10px}
.urow .un{flex:1;min-width:160px}
.urow .un small{display:block;color:var(--muted);font-size:12.5px}
.urow .btn{padding:6px 10px;font-size:13px}
/* Modal / visualizador / toast */
.modal-bg{position:fixed;inset:0;background:rgba(10,20,40,.55);display:grid;place-items:center;z-index:90;padding:16px}
.modal{background:#fff;border-radius:16px;max-width:440px;width:100%;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h3{margin:0 0 8px}
.modal .mb{color:var(--muted);line-height:1.5}
.modal .mb ul{margin:8px 0 0;padding-left:20px;color:var(--red)}
.modal .mf{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:60;display:flex;flex-direction:column}
.viewer .vt{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;color:#fff;gap:10px}
.viewer .vt a{color:#fff;text-decoration:none;background:rgba(255,255,255,.15);padding:8px 14px;border-radius:8px;font-size:14px}
.viewer .vb{flex:1;display:grid;place-items:center;min-height:0;padding:8px}
.viewer img,.viewer video{max-width:100%;max-height:100%;object-fit:contain}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;z-index:95;font-size:14.5px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90vw;text-align:center}

/* Câmera */
.cam{position:fixed;inset:0;background:#000;z-index:70;display:flex;flex-direction:column;color:#fff}
.cam-top{display:flex;align-items:center;gap:12px;padding:12px 14px;padding-top:max(12px,env(safe-area-inset-top))}
.cam-top button{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.15);font-size:18px}
.cam-top #camTitle{font-weight:600;flex:1}
.cam-top #camCount{background:var(--ok);padding:4px 12px;border-radius:20px;font-size:13px}
.cam-stage{position:relative;flex:1;min-height:0;display:grid;place-items:center;overflow:hidden}
.cam-stage video{max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain}
.stamp{position:absolute;right:12px;bottom:12px;text-align:right;font-size:15px;line-height:1.2;text-shadow:0 0 4px #000,1px 1px 2px #000;font-weight:500;white-space:pre}
.recind{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:var(--red);padding:5px 12px;border-radius:20px;font-weight:600;font-size:14px}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
.flash.go{opacity:.8;transition:none}
.cam-bottom{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:16px 20px;padding-bottom:max(20px,env(safe-area-inset-bottom))}
.modes{display:flex;gap:4px;background:rgba(255,255,255,.12);border-radius:20px;padding:3px;justify-self:start}
.modes button{padding:6px 14px;border-radius:16px;font-size:14px;font-weight:600;color:#ccc}
.modes button.on{background:#fff;color:#000}
.shutter{width:72px;height:72px;border-radius:50%;border:4px solid #fff;background:rgba(255,255,255,.25);position:relative}
.shutter::after{content:"";position:absolute;inset:6px;border-radius:50%;background:#fff;transition:.2s}
.shutter.video::after{background:var(--red)}
.shutter.recording::after{inset:20px;border-radius:6px;background:var(--red)}
#camFlip{justify-self:end;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.15);font-size:22px}

/* ---------- Celular ---------- */
@media (max-width:820px){
  .userbtn{width:32px;height:32px;font-size:12px}
  .syncinfo{font-size:11.5px;padding:5px 10px}
  .app{flex-direction:column}
  .sidebar{position:fixed;bottom:0;top:auto;left:0;right:0;width:auto;height:auto;padding:6px 6px max(6px,env(safe-area-inset-bottom));z-index:40;flex-direction:row;box-shadow:0 -4px 16px rgba(0,0,0,.15)}
  .brand,.side-foot{display:none}
  .toplogo{display:block}
  .nav{flex-direction:row;width:100%;gap:2px}
  .nav button{flex:1;flex-direction:column;gap:2px;padding:7px 2px;font-size:11.5px;position:relative}
  .nav .ico{font-size:19px}
  .nav .badge{position:absolute;top:2px;right:calc(50% - 26px);margin:0;background:var(--red);color:#fff;font-size:10.5px;padding:0 6px;min-width:18px}
  .nav button.on .badge{background:#fff;color:var(--side)}
  .topbar{padding:16px 16px 2px}
  .topbar h1{font-size:21px}
  #view{padding:10px 14px 110px}
  .hero{flex-direction:column;align-items:stretch;padding:22px}
  .hero .btn{width:100%}
  .rowc{grid-template-columns:1fr auto;gap:6px 10px}
  .rowc .hide-m{display:none}
  .resumo .card{padding:12px}
  .resumo .card b{font-size:21px}
  .seg{width:100%}
  .seg button{flex:1;min-width:0;padding:7px 4px}
  .finalbar{bottom:62px}
  .toast{bottom:84px}
}
</style>
</head>
<body>

<script>
'use strict';
const APP_VERSAO = '1.3.2';
/* =========================================================
   Utilidades
   ========================================================= */
const $ = (s, r = document) => r.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtStamp = d => { d = new Date(d); return d.toLocaleDateString('pt-BR',{day:'numeric',month:'short',year:'numeric'}) + ' ' + d.toLocaleTimeString('pt-BR'); };
const fmtCurto = d => new Date(d).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
const lsGet = k => { try { return localStorage.getItem(k); } catch(e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch(e) {} };

function norm(a) { if (a) { if (a.os === undefined) a.os = ''; if (!a.observacoes) a.observacoes = []; } return a; }
const getAtend = async id => norm(await DB.get('atend', id));
const numTxt = a => a.numero ? '#' + a.numero : '#—';
const idsMidias = a => [...a.etiqueta, ...a.horimetros, ...a.audios, ...a.midias, ...a.observacoes.flatMap(o => o.fotos)];
const Sessao = {
  get() { try { const x = JSON.parse(lsGet('sessao') || 'null'); return x && x.token && x.exp > Date.now() ? x : null; } catch (e) { return null; } },
  set(x) { lsSet('sessao', JSON.stringify(x)); },
  sair() { lsSet('sessao', ''); },
  admin() { const x = this.get(); return !!(x && x.admin); },
};
const quem = () => (Sessao.get() || {}).nome || '';
async function gravar(a) { a.atualizadoEm = Date.now(); a.sujo = true; await DB.put('atend', a); if (window.Sync) Sync.agendar(); }
const osTag = a => a.os ? `<span class="os-tag">OS ${esc(a.os)}</span>` : '';

const ST = {
  pendente:  { label:'Pendente',  cls:'s-pend' },
  em_espera: { label:'Em espera', cls:'s-esp'  },
  enviado:   { label:'Enviado',   cls:'s-env'  },
  concluido: { label:'Concluído', cls:'s-ok'   },
};
const COB = ['em_espera','enviado','concluido'];
const pill = s => `<span class="pill ${ST[s].cls}">${ST[s].label}</span>`;

let urls = [];
const mkUrl = b => { const u = URL.createObjectURL(b); urls.push(u); return u; };
const freeUrls = () => { urls.forEach(u => URL.revokeObjectURL(u)); urls = []; };

function toast(msg, ms = 2600) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), ms);
}
function modal({ titulo, corpo, botoes }) {
  return new Promise(res => {
    const bg = document.createElement('div'); bg.className = 'modal-bg';
    bg.innerHTML = `<div class="modal"><h3>${titulo}</h3><div class="mb">${corpo}</div><div class="mf">${
      botoes.map((b, i) => `<button class="btn ${b.cls || ''}" data-i="${i}">${b.label}</button>`).join('')}</div></div>`;
    bg.addEventListener('click', e => {
      const b = e.target.closest('[data-i]');
      if (b) { bg.remove(); res(botoes[+b.dataset.i].valor); }
      else if (e.target === bg) { bg.remove(); res(undefined); }
    });
    document.body.appendChild(bg);
  });
}
const confirmar = (titulo, corpo, ok = 'Confirmar', cls = '') =>
  modal({ titulo, corpo, botoes: [{ label:'Cancelar', cls:'ghost', valor:false }, { label:ok, cls, valor:true }] });

/* =========================================================
   Banco local (IndexedDB) — guarda atendimentos e mídias
   ========================================================= */
const DB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('bls-atendimentos', 1);
      r.onupgradeneeded = () => {
        const d = r.result;
        d.createObjectStore('atend', { keyPath:'id' });
        d.createObjectStore('midia', { keyPath:'id' });
      };
      r.onsuccess = () => { this.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  req(store, mode, fn) {
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, mode); const q = fn(t.objectStore(store));
      t.oncomplete = () => res(q.result); t.onerror = () => rej(t.error);
    });
  },
  all(s)    { return this.req(s, 'readonly',  o => o.getAll()); },
  get(s, k) { return this.req(s, 'readonly',  o => o.get(k)); },
  put(s, v) { return this.req(s, 'readwrite', o => o.put(v)); },
  del(s, k) { return this.req(s, 'readwrite', o => o.delete(k)); },
};

/* =========================================================
   Localização (GPS + endereço via OpenStreetMap, gratuito)
   ========================================================= */
const Geo = {
  watch: null, pos: null, linhas: ['Obtendo localização...'], ultimoEnd: null, buscando: false, ultTentativa: 0, tsEnd: 0,
  start() {
    if (!navigator.geolocation) { this.linhas = ['Localização indisponível']; return; }
    if (Date.now() - this.tsEnd > 10 * 60 * 1000) this.linhas = ['Obtendo localização...'];
    if (this.watch !== null) return;
    this.watch = navigator.geolocation.watchPosition(p => this.onPos(p),
      () => { if (!this.pos) this.linhas = ['Localização não permitida']; },
      { enableHighAccuracy:true, maximumAge:15000, timeout:20000 });
  },
  stop() { if (this.watch !== null) { navigator.geolocation.clearWatch(this.watch); this.watch = null; } },
  dist(a, b) {
    const R = 6371000, r = x => x * Math.PI / 180;
    const dLat = r(b.lat - a.lat), dLon = r(b.lon - a.lon);
    const h = Math.sin(dLat/2)**2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLon/2)**2;
    return 2 * R * Math.asin(Math.sqrt(h));
  },
  async onPos(p) {
    this.pos = { lat:p.coords.latitude, lon:p.coords.longitude, acc:Math.round(p.coords.accuracy) };
    const coord = `${this.pos.lat.toFixed(5)}, ${this.pos.lon.toFixed(5)}`;
    const precisa = !this.ultimoEnd || this.dist(this.ultimoEnd, this.pos) > 100;
    if (!precisa) return;
    if (!this.ultimoEnd || this.linhas[0].startsWith('Obtendo')) this.linhas = [coord];
    if (this.buscando || Date.now() - this.ultTentativa < 15000) return;
    this.buscando = true; this.ultTentativa = Date.now();
    try {
      const u = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&addressdetails=1&accept-language=pt-BR&lat=${this.pos.lat}&lon=${this.pos.lon}`;
      const j = await (await fetch(u)).json();
      const l = this.formatar(j.address || {});
      if (l.length) { this.linhas = l; this.ultimoEnd = { ...this.pos }; this.tsEnd = Date.now(); }
    } catch (e) { /* sem internet: fica com as coordenadas */ }
    finally { this.buscando = false; }
  },
  formatar(a) {
    const l = [
      [a.house_number, a.road].filter(Boolean).join(' '),
      a.suburb || a.neighbourhood || a.quarter || a.hamlet || '',
      a.city || a.town || a.village || a.municipality || '',
      a.state || '',
    ].filter(Boolean);
    return l.filter((x, i) => l.indexOf(x) === i);
  },
  meta() { return { ...(this.pos || {}), endereco: this.linhas.join(', ') }; },
};
const stampLines = () => [fmtStamp(new Date()), ...Geo.linhas];

function drawStamp(ctx, w, h, lines) {
  const fs = Math.max(14, Math.round(Math.min(w, h) * 0.04));
  ctx.save();
  ctx.font = `500 ${fs}px Roboto, "Segoe UI", Arial, sans-serif`;
  ctx.textAlign = 'right'; ctx.textBaseline = 'bottom'; ctx.fillStyle = '#fff';
  ctx.shadowColor = 'rgba(0,0,0,.9)'; ctx.shadowBlur = fs * 0.3; ctx.shadowOffsetX = 1; ctx.shadowOffsetY = 1;
  const pad = fs * 0.6, lh = fs * 1.18;
  lines.slice().reverse().forEach((t, i) => ctx.fillText(t, w - pad, h - pad - i * lh));
  ctx.restore();
}

/* =========================================================
   Câmera do app (fotos e vídeos com data/hora/endereço gravados)
   ========================================================= */
const Cam = {
  stream:null, facing:'environment', mode:'foto', allowVideo:false, unico:false, count:0,
  rec:null, chunks:[], raf:0, recTimer:0, stampTimer:0, onCapture:null, onClose:null, _fimRec:null, ocupado:false,

  async open(o) {
    Object.assign(this, { allowVideo:!!o.allowVideo, unico:!!o.unico, onCapture:o.onCapture, onClose:o.onClose, count:0, mode:'foto' });
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return this.fallback();
    $('#camTitle').textContent = o.titulo;
    $('#camCount').classList.add('hidden');
    $('#camModes').classList.toggle('hidden', !this.allowVideo);
    this.setMode('foto');
    $('#cam').classList.remove('hidden');
    Geo.start(); this.tick(); this.stampTimer = setInterval(() => this.tick(), 1000);
    try { await this.startStream(); }
    catch (e) { await this.close(true); this.fallback(); }
  },
  tick() { $('#camStamp').textContent = stampLines().join('\n'); },
  async startStream() {
    this.stopStream();
    const v = { facingMode:{ ideal:this.facing }, width:{ ideal:1920 }, height:{ ideal:1080 } };
    try { this.stream = await navigator.mediaDevices.getUserMedia({ video:v, audio:this.allowVideo }); }
    catch (e) { if (!this.allowVideo) throw e; this.stream = await navigator.mediaDevices.getUserMedia({ video:v, audio:false }); }
    const vid = $('#camVideo'); vid.srcObject = this.stream; await vid.play().catch(() => {});
  },
  stopStream() { if (this.stream) { this.stream.getTracks().forEach(t => t.stop()); this.stream = null; } },
  setMode(m) {
    if (this.rec) return;
    this.mode = m;
    document.querySelectorAll('#camModes button').forEach(b => b.classList.toggle('on', b.dataset.mode === m));
    $('#camShutter').className = 'shutter' + (m === 'video' ? ' video' : '');
  },
  contou() {
    this.count++;
    const c = $('#camCount'); c.textContent = `${this.count} salva${this.count > 1 ? 's' : ''}`; c.classList.remove('hidden');
  },
  async shutter() {
    if (this.mode === 'video') return this.rec ? this.stopRec() : this.startRec();
    if (this.ocupado) return;
    const v = $('#camVideo'); if (!v.videoWidth) return;
    this.ocupado = true;
    try {
      const c = document.createElement('canvas'); c.width = v.videoWidth; c.height = v.videoHeight;
      const ctx = c.getContext('2d'); ctx.drawImage(v, 0, 0); drawStamp(ctx, c.width, c.height, stampLines());
      const f = $('#camFlash'); f.classList.add('go'); requestAnimationFrame(() => requestAnimationFrame(() => f.classList.remove('go')));
      const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.88));
      await this.onCapture(blob, 'foto', Geo.meta());
      this.contou();
      if (this.unico) await this.close();
    } finally { this.ocupado = false; }
  },
  startRec() {
    if (!window.MediaRecorder) { toast('Este aparelho não grava vídeo pelo navegador.'); return; }
    const v = $('#camVideo'); if (!v.videoWidth) return;
    const k = Math.min(1, 1280 / Math.max(v.videoWidth, v.videoHeight));
    const c = document.createElement('canvas'); c.width = Math.round(v.videoWidth * k); c.height = Math.round(v.videoHeight * k);
    const ctx = c.getContext('2d');
    const loop = () => { ctx.drawImage(v, 0, 0, c.width, c.height); drawStamp(ctx, c.width, c.height, stampLines()); this.raf = requestAnimationFrame(loop); };
    loop();
    const cs = c.captureStream(30);
    const at = this.stream.getAudioTracks()[0]; if (at) cs.addTrack(at);
    const mime = ['video/mp4;codecs=avc1,mp4a','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm','video/mp4']
      .find(t => MediaRecorder.isTypeSupported(t)) || '';
    const meta = Geo.meta();
    this.chunks = [];
    this.rec = new MediaRecorder(cs, mime ? { mimeType:mime, videoBitsPerSecond:2500000 } : {});
    this.rec.ondataavailable = e => { if (e.data && e.data.size) this.chunks.push(e.data); };
    this.rec.onstop = async () => {
      cancelAnimationFrame(this.raf); clearInterval(this.recTimer);
      const blob = new Blob(this.chunks, { type:this.rec.mimeType || 'video/webm' });
      this.rec = null;
      $('#camRec').classList.add('hidden'); $('#camShutter').classList.remove('recording');
      await this.onCapture(blob, 'video', meta); this.contou();
      if (this._fimRec) { this._fimRec(); this._fimRec = null; }
    };
    this.rec.start(1000);
    const ini = Date.now(); const ind = $('#camRec'); ind.classList.remove('hidden');
    const upd = () => { const s = Math.floor((Date.now() - ini) / 1000); ind.textContent = `● REC ${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; };
    upd(); this.recTimer = setInterval(upd, 500);
    $('#camShutter').classList.add('recording');
  },
  stopRec() { return new Promise(r => { if (!this.rec) return r(); this._fimRec = r; this.rec.stop(); }); },
  async flip() { if (this.rec) return; this.facing = this.facing === 'environment' ? 'user' : 'environment'; try { await this.startStream(); } catch (e) { toast('Não foi possível trocar a câmera.'); } },
  async close(silencioso) {
    if (this.rec) await this.stopRec();
    this.stopStream(); clearInterval(this.stampTimer); Geo.stop();
    $('#cam').classList.add('hidden');
    const cb = this.onClose; this.onClose = null;
    if (cb && !silencioso) cb();
  },
  // Plano B: usa a câmera nativa do celular (foto recebe o carimbo depois)
  async fallback() {
    toast('Usando a câmera do aparelho.');
    Geo.start();
    const file = await new Promise(res => {
      const i = document.createElement('input'); i.type = 'file';
      i.accept = this.allowVideo ? 'image/*,video/*' : 'image/*'; i.setAttribute('capture', 'environment');
      i.onchange = () => res(i.files[0] || null); i.click();
    });
    if (file) {
      const meta = Geo.meta();
      if (file.type.startsWith('image/')) {
        const bmp = await createImageBitmap(file);
        const c = document.createElement('canvas'); c.width = bmp.width; c.height = bmp.height;
        const ctx = c.getContext('2d'); ctx.drawImage(bmp, 0, 0); drawStamp(ctx, c.width, c.height, stampLines());
        await this.onCapture(await new Promise(r => c.toBlob(r, 'image/jpeg', 0.88)), 'foto', meta);
      } else {
        await this.onCapture(file, 'video', meta);
      }
    }
    Geo.stop();
    const cb = this.onClose; this.onClose = null; if (cb) cb();
  },
};
$('#camClose').onclick = () => Cam.close();
$('#camShutter').onclick = () => Cam.shutter();
$('#camFlip').onclick = () => Cam.flip();
$('#camModes').onclick = e => { const b = e.target.closest('[data-mode]'); if (b) Cam.setMode(b.dataset.mode); };

function agendarSalvar() {

/* ---------- Gravação de áudio (descrição) ---------- */
const AudioRec = {
  rec:null, chunks:[], timer:0, _fim:null,
  async alternar() { if (this.rec) { this.rec.stop(); return; } return this.iniciar(); },
  async iniciar() {
    if (!navigator.mediaDevices || !window.MediaRecorder) { toast('Gravação de áudio não suportada neste navegador.'); return; }
    let s; try { s = await navigator.mediaDevices.getUserMedia({ audio:true }); } catch (e) { toast('Permita o uso do microfone para gravar.'); return; }
    const mime = ['audio/webm;codecs=opus','audio/mp4','audio/webm','audio/ogg'].find(t => MediaRecorder.isTypeSupported(t)) || '';
    const id = cur.id;
    this.chunks = [];
    this.rec = new MediaRecorder(s, mime ? { mimeType:mime } : {});
    this.rec.ondataavailable = e => { if (e.data && e.data.size) this.chunks.push(e.data); };
    this.rec.onstop = async () => {
      s.getTracks().forEach(t => t.stop()); clearInterval(this.timer);
      const blob = new Blob(this.chunks, { type:this.rec.mimeType || 'audio/webm' }); this.rec = null;
      await anexar(id, 'audios', blob, 'audio', Geo.meta());
      if (this._fim) { this._fim(); this._fim = null; }
      else if (atual.view === 'form' && atual.id === id) { freeUrls(); render(); }
    };
    this.rec.start(1000);
    const b = $('#btnRec'), ini = Date.now();
    b.classList.add('rec');
    const upd = () => { const t = Math.floor((Date.now() - ini) / 1000); const bb = $('#btnRec'); if (bb) bb.textContent = `■ Parar gravação ${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`; };
    upd(); this.timer = setInterval(upd, 500);
  },
  parar() { return new Promise(r => { if (!this.rec) return r(); this._fim = r; this.rec.stop(); }); },
};

/* =========================================================
   Nuvem: sincronização com o Google Drive (Apps Script)
   ========================================================= */
const paraB64 = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1] || ''); r.onerror = () => rej(r.error); r.readAsDataURL(b); });
const deB64 = (s, mime) => { const bin = atob(s); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new Blob([u], { type:mime }); };
function nomeArquivo(m) {
  const ext = { 'image/jpeg':'jpg', 'image/png':'png', 'image/webp':'webp', 'video/mp4':'mp4', 'video/webm':'webm', 'video/quicktime':'mov',
                'audio/webm':'webm', 'audio/mp4':'m4a', 'audio/ogg':'ogg', 'audio/mpeg':'mp3' }[(m.mime || '').split(';')[0]] || 'bin';
  const nomes = { etiqueta:'Etiqueta', horimetros:'Horimetro', audios:'Audio', midias: m.tipo === 'video' ? 'Video' : 'Foto', observacoes:'Observacao' };
  const d = new Date(m.criadoEm), p = n => String(n).padStart(2, '0');
  return `${nomes[m.campo] || 'Arquivo'}_${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}_${p(d.getHours())}-${p(d.getMinutes())}-${p(d.getSeconds())}_${m.id.slice(-4)}.${ext}`;
}

const Sync = {
  rodando:false, denovo:false, t:0, mudou:false, estado:{ tipo:'', txt:'', dica:'' },
  cfg() { try { const c = JSON.parse(lsGet('cfg') || 'null'); return c && c.url && c.chave ? c : null; } catch (e) { return null; } },
  async api(acao, dados = {}, cfg = this.cfg()) {
    let r;
    const sess = Sessao.get();
    try { r = await fetch(cfg.url, { method:'POST', body: JSON.stringify({ ...dados, acao, chave:cfg.chave, token: sess ? sess.token : undefined }) }); }
    catch (e) { throw new Error('Sem conexão com o servidor'); }
    let j; try { j = await r.json(); } catch (e) { throw new Error('Resposta inválida do servidor (confira a URL e se a implantação está como "Qualquer pessoa")'); }
    if (!j.ok) {
      if (j.sessao && sess) { Sessao.sair(); mostrarGate('login', j.erro); }
      throw new Error(j.erro || 'Erro no servidor');
    }
    return j;
  },
  status(tipo, txt, dica = '') {
    this.estado = { tipo, txt, dica };
    const el = $('#syncInfo'); if (el) { el.className = 'syncinfo ' + tipo; el.textContent = txt; el.title = dica; }
    const c = $('#cfgStatus'); if (c) c.textContent = txt + (dica ? ' — ' + dica : '');
  },
  agendar(ms = 1500) { clearTimeout(this.t); this.t = setTimeout(() => this.rodar(), ms); },
  async qtdPendentes() { return (await DB.all('atend')).filter(a => a.sujo).length; },
  async rodar() {
    clearTimeout(this.t);
    if (!this.cfg()) { this.status('local', '⚠ Sem nuvem', 'Aparelho não conectado'); return; }
    if (!Sessao.get()) return;
    if (this.rodando) { this.denovo = true; return; }
    if (!navigator.onLine) { const n = await this.qtdPendentes(); this.status('offline', `📴 Sem internet${n ? ' · ' + n + ' a enviar' : ''}`); return; }
    this.rodando = true; this.mudou = false;
    try {
      await this.enviar();
      await this.receber();
      this.status('ok', '☁ Sincronizado ' + new Date().toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' }));
    } catch (e) {
      const n = await this.qtdPendentes();
      this.status('erro', `⚠ Não sincronizado${n ? ' · ' + n + ' a enviar' : ''}`, e.message);
    } finally {
      this.rodando = false;
      if (this.mudou) atualizarTela();
      if (this.denovo) { this.denovo = false; this.agendar(300); }
    }
  },
  async enviar() {
    await flush();
    const sujos = (await DB.all('atend')).map(norm).filter(a => a.sujo);
    for (let a of sujos) {
      if (!a.numero || !a.pastaId) a = await this.salvarRemoto(a);   // garante nº e pasta no Drive
      const faltam = [];
      for (const id of idsMidias(a)) { const m = await DB.get('midia', id); if (m && m.blob && !m.driveId) faltam.push(m); }
      let i = 0;
      for (const m of faltam) {
        i++; this.status('envio', `⟳ Enviando ${numTxt(a)} · arquivo ${i}/${faltam.length}`);
        m.driveId = await this.upload(m, a);
        const atualM = await DB.get('midia', m.id); if (atualM) { atualM.driveId = m.driveId; await DB.put('midia', atualM); }
      }
      await this.salvarRemoto(norm(await DB.get('atend', a.id)) || a);
      this.mudou = true;
    }
  },
  async salvarRemoto(a) {
    const env = { ...a }; delete env.sujo;
    env._midias = [];
    for (const id of idsMidias(a)) {
      const m = await DB.get('midia', id);
      if (m) env._midias.push({ id:m.id, campo:m.campo, tipo:m.tipo, mime:m.mime, criadoEm:m.criadoEm, local:m.local, driveId:m.driveId || null });
    }
    const r = (await this.api('salvar', { atend:env })).atend;
    await this.aplicar(r);
    return norm(await DB.get('atend', a.id)) || norm(r);
  },
  async aplicar(x) {
    for (const i of (x._midias || [])) {
      const m = await DB.get('midia', i.id);
      if (!m) await DB.put('midia', { ...i, atendId:x.id, blob:null });
      else if (!m.driveId && i.driveId) { m.driveId = i.driveId; await DB.put('midia', m); }
    }
    delete x._midias;
    const l = norm(await DB.get('atend', x.id));
    if (x.excluido) {
      if (l) { for (const id of idsMidias(l)) await DB.del('midia', id); await DB.del('atend', x.id); this.mudou = true; }
      return;
    }
    const base = { numero:x.numero, pasta:x.pasta, pastaId:x.pastaId };
    if (cur && cur.id === x.id) Object.assign(cur, base);
    if (l && l.sujo && l.atualizadoEm > x.atualizadoEm) { Object.assign(l, base); await DB.put('atend', l); return; }
    if (cur && cur.id === x.id && saveT) return;   // técnico digitando agora
    x.sujo = false;
    await DB.put('atend', norm(x));
    if (!l || l.atualizadoEm !== x.atualizadoEm || l.numero !== x.numero) this.mudou = true;
  },
  async receber() {
    const desde = Number(lsGet('ultimoPull')) || 0;
    const r = await this.api('listar', { desde });
    for (const x of r.itens) await this.aplicar(x);
    lsSet('ultimoPull', String(r.agora));
  },
  async upload(m, a) {
    const b = m.blob, N = 4 * 1024 * 1024;
    const mime = (b.type || m.mime || 'application/octet-stream').split(';')[0];
    if (!b.size) return 'vazio';
    let off = 0, sessao = null;
    while (off < b.size) {
      const parte = b.slice(off, off + N);
      const r = await this.api('upload', { atendId:a.id, nome:nomeArquivo(m), mime, tamanho:b.size, offset:off, sessao, data: await paraB64(parte) });
      off += parte.size;
      if (r.fim) return r.driveId;
      sessao = r.sessao;
    }
    throw new Error('Envio incompleto');
  },
  async baixar(m) {
    const r = await this.api('baixar', { driveId:m.driveId });
    m.blob = deB64(r.data, (m.mime || r.mime || '').split(';')[0] || r.mime);
    await DB.put('midia', m);
    return m.blob;
  },
};
window.Sync = Sync;

function atualizarTela() {
  if (atual.view === 'form') { if (cur) $('#titulo').textContent = 'Atendimento ' + numTxt(cur); return; }
  const ae = document.activeElement;
  if (ae && /INPUT|TEXTAREA/.test(ae.tagName)) return;      // não atrapalha quem está digitando
  if (document.querySelector('.modal-bg, .viewer') || !$('#cam').classList.contains('hidden')) return;
  const y = window.scrollY; freeUrls(); render().then(() => window.scrollTo(0, y));
}

const baixando = new Set();
function carregarPendentes() {
  if (!Sync.cfg()) return;
  document.querySelectorAll('[data-lazy],[data-lazyaudio]').forEach(el => {
    const id = el.dataset.lazy || el.dataset.lazyaudio;
    if (baixando.has(id)) return; baixando.add(id);
    (async () => {
      try {
        const m = await DB.get('midia', id); if (!m || !m.driveId) return;
        if (m.tipo === 'video') {
          const r = await Sync.api('miniatura', { driveId:m.driveId });
          if (r.data && el.isConnected) el.insertAdjacentHTML('afterbegin', `<img src="data:${r.mime};base64,${r.data}" alt="">`);
          return;
        }
        const b = m.blob || await Sync.baixar(m);
        if (!el.isConnected) return;
        const del = el.querySelector('.del'); const delHtml = del ? del.outerHTML : '';
        if (el.dataset.lazyaudio) el.outerHTML = audioItem(m, !!del);
        else { el.classList.remove('lazy'); el.removeAttribute('data-lazy'); el.innerHTML = `<img src="${mkUrl(b)}" alt="">${delHtml}`; }
      } catch (e) { /* tenta de novo na próxima tela */ }
      finally { baixando.delete(id); }
    })();
  });
}

/* ---------- Ajustes ---------- */
function linkConfig() { const c = Sync.cfg(); return location.origin + location.pathname + '#cfg=' + encodeURIComponent(btoa(JSON.stringify({ u:c.url, k:c.chave }))); }
async function vConfig() {
  cab('Ajustes', 'Conexão com o Google Drive');
  const c = Sync.cfg() || { url:'', chave:'' };
  $('#view').innerHTML = `
    <div class="card cfg" style="max-width:660px">
      <h3 style="margin-top:0">Nuvem (Google Drive)</h3>
      <p style="color:var(--muted);margin-top:0">Com a nuvem conectada, os atendimentos de todos os aparelhos ficam juntos na planilha e as fotos/vídeos na pasta do Drive.</p>
      <label>URL do servidor (App da Web)</label>
      <input class="inp" id="cfgUrl" autocomplete="off" placeholder="https://script.google.com/macros/s/.../exec" value="${esc(c.url)}">
      <label>Chave de acesso</label>
      <input class="inp" id="cfgChave" autocomplete="off" value="${esc(c.chave)}">
      <div class="btnrow"><button class="btn" data-cfg="salvar">Salvar e testar</button>
        ${Sync.cfg() ? '<button class="btn sec" data-cfg="sync">⟳ Sincronizar agora</button><button class="btn ghost" data-cfg="sair">Desconectar</button>' : ''}</div>
      <div id="cfgStatus" style="margin-top:12px;font-size:14px;color:var(--muted)">${esc(Sync.estado.txt)}${Sync.estado.dica ? ' — ' + esc(Sync.estado.dica) : ''}</div>
    </div>
    ${Sync.cfg() ? `<div class="card cfg" style="max-width:660px;margin-top:14px">
      <h3 style="margin-top:0">Conectar o celular dos técnicos</h3>
      <p style="color:var(--muted);margin-top:0">Envie este link pelo WhatsApp. Ao abrir no celular, o app já fica conectado, sem digitar nada.</p>
      <input class="inp" id="cfgLink" readonly value="${esc(linkConfig())}">
      <div class="btnrow"><button class="btn sec" data-cfg="copiar">📋 Copiar link</button></div></div>` : ''}
    ${Sync.cfg() ? `<div class="card cfg" style="max-width:660px;margin-top:14px">
      <h3 style="margin-top:0">Usuários</h3>
      <p style="color:var(--muted);margin-top:0">Quando um técnico entra pela primeira vez com a conta Google, ele aparece aqui como <b>Pendente</b>. Libere só quem for da equipe.</p>
      <div class="ulist" id="usuList"><span style="color:var(--muted)">Carregando...</span></div></div>` : ''}
    <div class="card" style="max-width:660px;margin-top:14px;color:var(--muted);font-size:14px">Versão do app: <b>${APP_VERSAO}</b></div>`;
  if (Sync.cfg()) carregarUsuarios();
}
async function carregarUsuarios() {
  const el = $('#usuList'); if (!el) return;
  try {
    const { usuarios } = await Sync.api('usuarios');
    if (!$('#usuList')) return;
    const ordem = { Pendente:0, Liberado:1, Bloqueado:2 };
    usuarios.sort((a, b) => (ordem[a.situacao] ?? 3) - (ordem[b.situacao] ?? 3));
    const cor = { Pendente:'var(--pend)', Liberado:'var(--ok)', Bloqueado:'var(--red)' };
    el.innerHTML = usuarios.length ? usuarios.map(u => `<div class="urow">
      <div class="un"><b>${esc(u.nome)}</b> <span style="color:${cor[u.situacao] || 'var(--muted)'};font-size:12.5px;font-weight:600">● ${esc(u.situacao)}</span>
        <small>${esc(u.email)} · último acesso: ${u.ultimoAcesso ? fmtCurto(u.ultimoAcesso) : '—'}</small></div>
      ${u.situacao !== 'Liberado' ? `<button class="btn" data-usu="${esc(u.email)}" data-op="liberar">Liberar</button>` : ''}
      ${u.situacao === 'Liberado' ? `<button class="btn danger" data-usu="${esc(u.email)}" data-op="bloquear">Bloquear</button>` : ''}
      ${u.situacao !== 'Liberado' ? `<button class="btn ghost" data-usu="${esc(u.email)}" data-op="excluir">Remover</button>` : ''}
    </div>`).join('') : '<span style="color:var(--muted)">Nenhum técnico cadastrado ainda.</span>';
  } catch (e) { el.innerHTML = `<span style="color:var(--red)">${esc(e.message)}</span>`; }
}
async function usuarioAcao(usuario, op) {
  const txt = { liberar:['Liberar acesso?', `<b>${esc(usuario)}</b> poderá entrar no app e registrar atendimentos.`, 'Liberar'],
                bloquear:['Bloquear usuário?', `<b>${esc(usuario)}</b> não conseguirá mais entrar nem enviar atendimentos.`, 'Bloquear'],
                excluir:['Remover usuário?', `<b>${esc(usuario)}</b> sai da lista. Se entrar de novo, volta como pendente.`, 'Remover'] }[op];
  if (!await confirmar(txt[0], txt[1], txt[2], op === 'liberar' ? '' : 'danger')) return;
  try { await Sync.api('usuarioAcao', { email:usuario, op }); toast('Feito ✓'); carregarUsuarios(); verificarPendentes(); } catch (e) { toast(e.message); }
}
async function cfgAcao(acao) {
  if (acao === 'salvar') {
    const url = $('#cfgUrl').value.trim(), chave = $('#cfgChave').value.trim();
    if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)) { toast('Cole a URL do App da Web (começa com https://script.google.com/)'); return; }
    if (!chave) { toast('Informe a chave de acesso.'); return; }
    await conectar({ url, chave });
  } else if (acao === 'sync') {
    await Sync.rodar(); toast(Sync.estado.txt);
  } else if (acao === 'sair') {
    if (!await confirmar('Desconectar da nuvem?', 'Este aparelho deixa de enviar e receber atendimentos. Nada é apagado do Drive.', 'Desconectar', 'danger')) return;
    lsSet('cfg', ''); lsSet('ultimoPull', '0'); Sessao.sair(); mostrarGate('conectar');
  } else if (acao === 'copiar') {
    const i = $('#cfgLink'); i.select();
    try { await navigator.clipboard.writeText(i.value); } catch (e) { document.execCommand('copy'); }
    toast('Link copiado');
  }
}
async function conectar(c) {
  toast('Testando conexão...');
  try { await Sync.api('ping', {}, c); }
  catch (e) { await modal({ titulo:'Não foi possível conectar', corpo:esc(e.message), botoes:[{ label:'OK', valor:1 }] }); return false; }
  const anterior = Sync.cfg();
  lsSet('cfg', JSON.stringify(c));
  if (!anterior || anterior.url !== c.url) {
    lsSet('ultimoPull', '0');
    const locais = (await DB.all('atend')).map(norm).filter(a => !a.pastaId && !a.excluido);
    if (locais.length) {
      const r = await modal({ titulo:'Atendimentos deste aparelho',
        corpo:`Existem <b>${locais.length}</b> atendimento(s) registrados só neste aparelho. O que fazer com eles?`,
        botoes:[{ label:'Apagar (eram testes)', cls:'danger', valor:'apagar' }, { label:'Enviar para a nuvem', valor:'enviar' }] });
      for (const a of locais) {
        if (r === 'apagar') { for (const id of idsMidias(a)) await DB.del('midia', id); await DB.del('atend', a.id); }
        else { a.numero = null; a.sujo = true; await DB.put('atend', a); }
      }
    }
  }
  toast('Conectado à nuvem ✓');
  if (!Sessao.get()) { mostrarGate('login'); return true; }
  await Sync.rodar(); freeUrls(); render();
  return true;
}
async function configPorLink() {
  const m = location.hash.match(/#cfg=([^&]+)/); if (!m) return;
  history.replaceState(null, '', location.pathname);
  let d; try { d = JSON.parse(atob(decodeURIComponent(m[1]))); } catch (e) { toast('Link de configuração inválido'); return; }
  if (await confirmar('Conectar este aparelho?', 'Este link conecta o app à nuvem da BLS Refrigeração, para enviar os atendimentos ao Drive.', 'Conectar')) await conectar({ url:d.u, chave:d.k });
}
$('#syncInfo').onclick = () => Sync.rodar();

/* ---------- Entrada (login) ---------- */
function gateMsg(t) { const m = $('#gMsg'); if (m) m.textContent = t || ''; }
function gateCarregando(btn, sim) { if (!btn) return; btn.disabled = sim; if (sim) { btn.dataset.t = btn.textContent; btn.textContent = 'Aguarde...'; } else if (btn.dataset.t) btn.textContent = btn.dataset.t; }
function mostrarGate(modo, aviso = '') {
  modo = modo || (!Sync.cfg() ? 'conectar' : 'login');
  $('#gate').classList.remove('hidden');
  $('#gateLogo').src = $('#logoImg').src;
  $('#gateVer').textContent = 'Versão ' + APP_VERSAO;
  const b = $('#gateBody');
  if (modo === 'conectar') {
    b.innerHTML = `<h2>Conectar aparelho</h2>
      <p>Abra o link de conexão enviado pelo administrador ou informe os dados abaixo.</p>
      <label>URL do servidor</label><input class="inp" id="gUrl" autocomplete="off" placeholder="https://script.google.com/macros/s/.../exec">
      <label>Chave de acesso</label><input class="inp" id="gChave" autocomplete="off">
      <div class="gate-msg" id="gMsg">${esc(aviso)}</div>
      <button class="btn" id="gConectar">Conectar</button>`;
    $('#gConectar').onclick = async e => {
      const url = $('#gUrl').value.trim(), chave = $('#gChave').value.trim();
      if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(url) || !chave) { gateMsg('Informe a URL (https://script.google.com/...) e a chave.'); return; }
      gateCarregando(e.target, true); await conectar({ url, chave }); gateCarregando(e.target, false);
    };
  } else if (modo === 'login') {
    b.innerHTML = `<h2>Entrar</h2>
      <p>Entre com a sua conta Google. No primeiro acesso, o administrador precisa liberar a sua entrada.</p>
      <div class="gate-msg" id="gMsg">${esc(aviso)}</div>
      <div id="gGoogle"><small style="color:var(--muted)">Carregando...</small></div>`;
    prepararGoogle();
  } else if (modo === 'pendente') {
    b.innerHTML = `<h2>Aguardando liberação</h2>
      <p>${aviso}</p>
      <p>Avise o administrador. Depois que ele liberar, toque em <b>Tentar de novo</b>.</p>
      <button class="btn" id="gDeNovo">Tentar de novo</button>`;
    $('#gDeNovo').onclick = () => mostrarGate('login');
  }
}
function carregarScript(src) {
  return new Promise((res, rej) => {
    if (document.querySelector(`script[src="${src}"]`)) return window.google && google.accounts ? res() : setTimeout(res, 800);
    const sc = document.createElement('script'); sc.src = src; sc.async = true; sc.onload = res; sc.onerror = rej; document.head.appendChild(sc);
  });
}
async function prepararGoogle() {
  const el = $('#gGoogle'); if (!el) return;
  let cid = lsGet('googleClientId') || '';
  try { cid = (await Sync.api('ping')).googleClientId || ''; lsSet('googleClientId', cid); } catch (e) {}
  if (!$('#gGoogle')) return;
  if (!cid) { el.innerHTML = '<small style="color:var(--muted)">O login com Google será liberado em instantes.</small>'; return; }
  try {
    await carregarScript('https://accounts.google.com/gsi/client');
    google.accounts.id.initialize({ client_id:cid, callback: async r => {
      gateMsg('Verificando...');
      try {
        const x = await Sync.api('loginGoogle', { credencial:r.credential });
        if (x.pendente) mostrarGate('pendente', `Olá, <b>${esc(x.nome)}</b>! Seu acesso (${esc(x.email)}) foi solicitado e está aguardando a liberação do administrador.`);
        else entrouCom(x.sessao);
      }
      catch (e) { gateMsg(e.message); }
    } });
    el.innerHTML = '';
    google.accounts.id.renderButton(el, { theme:'filled_blue', size:'large', text:'signin_with', locale:'pt-BR', shape:'pill', width:300 });
  } catch (e) { el.innerHTML = '<small style="color:var(--muted)">Sem conexão com o Google.</small>'; }
}
function entrouCom(sessao) {
  Sessao.set(sessao);
  $('#gate').classList.add('hidden');
  aplicarPerfil();
  toast('Olá, ' + sessao.nome + '!');
  go('inicio');
  Sync.rodar();
  verificarPendentes();
}
async function verificarPendentes() {
  const b = $('#bCfg'); if (!Sessao.admin()) { b.classList.add('hidden'); return; }
  try {
    const n = (await Sync.api('usuarios')).usuarios.filter(u => u.situacao === 'Pendente').length;
    b.textContent = n; b.title = n + ' aguardando liberação'; b.classList.toggle('hidden', !n);
  } catch (e) {}
}
function aplicarPerfil() {
  const s = Sessao.get();
  document.querySelector('[data-nav="config"]').classList.toggle('hidden', !(s && s.admin));
  const ub = $('#userBtn');
  ub.classList.toggle('hidden', !s);
  if (s) { ub.textContent = s.nome.split(/\s+/).slice(0, 2).map(x => x[0] || '').join('').toUpperCase(); ub.title = s.nome; }
}
$('#userBtn').onclick = async () => {
  const s = Sessao.get(); if (!s) return;
  const r = await modal({ titulo: esc(s.nome), corpo: `${s.admin ? 'Administrador · ' : ''}${esc(s.usuario)}`,
    botoes: [{ label:'Fechar', cls:'ghost', valor:false }, { label:'Sair', cls:'danger', valor:true }] });
  if (!r) return;
  await flush(); Sessao.sair(); aplicarPerfil(); mostrarGate('login');
};

/* =========================================================
   Cliques (delegação)
   ========================================================= */
$('#view').addEventListener('click', async e => {
  const t = e.target;
  let el;
  if ((el = t.closest('[data-delm]'))) { e.stopPropagation(); return removerMidia(el.dataset.delm, el.dataset.campo); }
  if ((el = t.closest('[data-deldraft]'))) { e.stopPropagation(); obsDraft.fotos.splice(+el.dataset.deldraft, 1); freeUrls(); return render(); }
  if ((el = t.closest('[data-delobs]'))) { return excluirObs(el.dataset.delobs); }
  if ((el = t.closest('[data-obs]'))) { return obsAcao(el.dataset.obs); }
  if ((el = t.closest('[data-cfg]'))) { return cfgAcao(el.dataset.cfg); }
  if ((el = t.closest('[data-usu]'))) { return usuarioAcao(el.dataset.usu, el.dataset.op); }
  if ((el = t.closest('[data-cob]')))  { return mudarCobranca(el.closest('[data-id]').dataset.id, el.dataset.cob); }
  if ((el = t.closest('[data-ver]')))  { return verMidia(el.dataset.ver); }
  if ((el = t.closest('[data-cam]')))  { return abrirCamera(el.dataset.cam); }
  if ((el = t.closest('[data-filtro]'))) { filtros.status = el.dataset.filtro; return render(); }
  if ((el = t.closest('[data-nav2]'))) { return go(el.dataset.nav2); }
  if ((el = t.closest('[data-act]'))) {
    const act = el.dataset.act;
    if (act === 'novo') return novoAtendimento();
    if (act === 'finalizar') return finalizar();
    if (act === 'excluir') return excluir();
  }
  if ((el = t.closest('[data-open]'))) {
    const a = await getAtend(el.dataset.open);
    return go(a.status === 'pendente' ? 'form' : 'detalhe', a.id);
  }
});
/* Atualização automática: quando houver versão nova no site, o app recarrega sozinho */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').then(reg => {
    setInterval(() => reg.update().catch(() => {}), 30 * 60 * 1000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => {}); });
  }).catch(() => {});
  let recarregou = false;
  navigator.serviceWorker.addEventListener('controllerchange', async () => {
    if (recarregou) return; recarregou = true;
    if (Cam.stream || AudioRec.rec) return;      // não interrompe gravação; aplica na próxima abertura
    await flush(); location.reload();
  });
}
window.addEventListener('pagehide', () => { if (saveT) salvar(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && saveT) salvar(); });

/* =========================================================
   Início
   ========================================================= */
(async () => {
  try {
    $('#versao').textContent = APP_VERSAO;
    $('#topLogo').src = $('#logoImg').src;
    await DB.open();
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
    aplicarPerfil();
    if (!Sync.cfg() || !Sessao.get()) mostrarGate();
    await render();
    await configPorLink();
    Sync.rodar();
    if (Sessao.admin()) verificarPendentes();
    setInterval(() => { if (!document.hidden) Sync.rodar(); }, 60 * 1000);
    setInterval(() => { if (!document.hidden) verificarPendentes(); }, 5 * 60 * 1000);
    window.addEventListener('online', () => Sync.rodar());
    window.addEventListener('offline', () => Sync.rodar());
    document.addEventListener('visibilitychange', () => { if (!document.hidden) Sync.rodar(); });
  } catch (e) {
    $('#view').innerHTML = `<div class="empty">Não foi possível abrir o armazenamento local deste navegador.<br>${esc(e.message || e)}</div>`;
  }
})();
</script>
